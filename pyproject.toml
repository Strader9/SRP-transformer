[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbv-oligoformer"
version = "0.1.0"
description = "HBV multi-genotype extension for OligoFormer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
hbv-sirna = "hbv_sirna.cli:main"

[tool.setuptools.packages.find]
include = ["hbv_sirna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

